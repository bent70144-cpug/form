name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install, lint, typecheck, test
    runs-on: ubuntu-latest
    env:
      # CI has no Docker Postgres; database tests boot the embedded-postgres
      # substitute on localhost:5433 (see docs/adr/0001-local-infra-substitutes.md).
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w lint

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Test
        run: pnpm -w test
